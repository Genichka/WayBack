# Збирає APK WayBack (телефон + Android Auto) при кожному оновленні файлів у main.
# Готовий файл: вкладка Actions → останній запуск → Artifacts → WayBack-apk,
# а також сторінка Releases (тег apk-latest) — звідти зручно качати з телефона.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android-проєкт — тека android/. Якщо колись завантажиш його архівом android-src.zip
      # (зручно з телефона), він розпакується поверх.
      - name: Unpack Android project
        run: |
          if [ -f android-src.zip ]; then unzip -o -q android-src.zip; fi
          test -f android/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK на ubuntu-latest уже встановлений (ANDROID_HOME), окремий крок не потрібен

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      # Ключ підпису з Secrets (Settings → Secrets and variables → Actions):
      # WB_KEYSTORE_B64 - файл ключа в base64, WB_STORE_PASS, WB_KEY_ALIAS, WB_KEY_PASS.
      # Якщо секретів ще немає - gradle візьме старий android/app/wayback.keystore.
      - name: Signing key from secrets
        env:
          KS_B64: ${{ secrets.WB_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.WB_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.WB_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wb.keystore"
            {
              echo "WB_KEYSTORE=$RUNNER_TEMP/wb.keystore"
              echo "WB_STORE_PASS=$STORE_PASS"
              echo "WB_KEY_ALIAS=$KEY_ALIAS"
              echo "WB_KEY_PASS=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Підпис: ключ із Secrets"
          else
            echo "::warning::Секрет WB_KEYSTORE_B64 не задано - підпис старим ключем з репозиторію"
          fi

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VER=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" app.js)
          cp android/app/build/outputs/apk/debug/app-debug.apk WayBack.apk
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: WayBack-apk
          path: WayBack.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WayBack APK ${{ env.VER }} (збірка ${{ github.run_number }})
          body: Свіжа збірка для Android і Android Auto. Встанови APK поверх старого — дані збережуться.
          files: WayBack.apk
          make_latest: true
